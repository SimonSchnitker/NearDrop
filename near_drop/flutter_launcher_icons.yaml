# flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  # image_path: "assets/app_icon/icon_1024x1024.png"

  android: true
  image_path_android: "assets/app_icon/android/ic_launcher.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "assets/app_icon/android/ic_launcher_background.png"
  adaptive_icon_foreground: "assets/app_icon/android/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/app_icon/android/ic_launcher_monochrome.png"

  ios: true
  image_path_ios: "assets/app_icon/ios/icon_1024x1024.png"
  remove_alpha_channel_ios: true
  image_path_ios_dark_transparent: "assets/app_icon/ios/icon_transparent_1024x1024.png"
  image_path_ios_tinted_grayscale: "assets/app_icon/ios/icon_transparent_1024x1024.png"
  # desaturate_tinted_to_grayscale_ios: true

  web:
    generate: false
    image_path: "path/to/image.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"

  windows:
    generate: true
    image_path: "assets/app_icon/windows/icon_1024x1024.png"
    icon_size: 256 # min:48, max:256, default: 48

  macos:
    generate: true
    image_path: "assets/app_icon/macos/macos_1024x1024.png"
